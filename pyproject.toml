[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agenqo"
version = "0.8.0"
description = "Independent agent-ready services marketplace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
  "PyJWT[crypto]>=2.10,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
analytics = ["duckdb>=1.4,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "duckdb>=1.4,<3"]

[tool.setuptools.packages.find]
include = ["agenqo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
