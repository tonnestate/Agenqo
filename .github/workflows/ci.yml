name: Agenqo CI (existing MySQL + embedded DuckDB)
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_USER: agenqo
          MYSQL_PASSWORD: ci_only_password
          MYSQL_DATABASE: agenqo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_root_only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENQO_DATABASE_URL: mysql+pymysql://agenqo:ci_only_password@127.0.0.1:3306/agenqo_ci?charset=utf8mb4
      AGENQO_ALLOW_SQLITE_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - name: Migrate clean MySQL schema
        run: alembic upgrade head
      - name: Verify MySQL schema
        run: |
          python -c 'from agenqo.database import engine; from sqlalchemy import inspect; assert {"companies","company_memberships","company_observations","bookings","request_economic_events","alembic_version"} <= set(inspect(engine).get_table_names())'
      - name: Concurrent real MySQL booking approval
        run: python tests/mysql_booking_race.py
  quote-form:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
