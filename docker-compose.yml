# Only Agenqo's application runs here. It connects to the user's EXISTING MySQL.
# No MySQL/PostgreSQL/MongoDB container will be started by this compose project.
services:
  api:
    build: .
    environment:
      AGENQO_DATABASE_URL: ${AGENQO_DATABASE_URL:?Provide URL for existing MySQL server}
      AGENQO_ADMIN_KEY: ${AGENQO_ADMIN_KEY:?Set long random admin key}
      AGENQO_OIDC_ISSUER: ${AGENQO_OIDC_ISSUER:-}
      AGENQO_OIDC_AUDIENCE: ${AGENQO_OIDC_AUDIENCE:-}
      AGENQO_OIDC_CLIENT_ID: ${AGENQO_OIDC_CLIENT_ID:-}
      AGENQO_OIDC_JWKS_URL: ${AGENQO_OIDC_JWKS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    # Dev/demo only. Run migrations separately under change control before production.
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn agenqo.api:app --host 0.0.0.0 --port 8080"]
    restart: unless-stopped
